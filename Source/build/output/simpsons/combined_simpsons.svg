<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Bart Simpson - Left Side -->
  <g transform="translate(150,100)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="60" ry="80" fill="yellow" stroke="black" stroke-width="2"/>
    
    <!-- Head -->
    <circle cx="0" cy="-90" r="45" fill="yellow" stroke="black" stroke-width="2"/>
    
    <!-- Hair -->
    <path d="M-40,-90 Q-20,-120 0,-110 Q20,-120 40,-90 Q35,-80 20,-75 Q5,-80 -10,-75 Q-25,-80 -30,-85 Z" fill="black"/>
    
    <!-- Eyes -->
    <circle cx="-15" cy="-95" r="8" fill="white" stroke="black" stroke-width="1"/>
    <circle cx="15" cy="-95" r="8" fill="white" stroke="black" stroke-width="1"/>
    <circle cx="-15" cy="-95" r="4" fill="black"/>
    <circle cx="15" cy="-95" r="4" fill="black"/>
    
    <!-- Mouth -->
    <path d="M-10,-70 Q0,-60 10,-70" stroke="black" stroke-width="2" fill="none"/>
    
    <!-- Arms -->
    <ellipse cx="-70" cy="-20" rx="15" ry="40" fill="yellow" stroke="black" stroke-width="2" transform="rotate(-30)"/>
    <ellipse cx="70" cy="-20" rx="15" ry="40" fill="yellow" stroke="black" stroke-width="2" transform="rotate(30)"/>
    
    <!-- Legs -->
    <ellipse cx="-25" cy="80" rx="15" ry="40" fill="yellow" stroke="black" stroke-width="2"/>
    <ellipse cx="25" cy="80" rx="15" ry="40" fill="yellow" stroke="black" stroke-width="2"/>
    
    <!-- Belly Button -->
    <circle cx="0" cy="0" r="5" fill="black"/>
    
    <!-- Bart's Penis - Positioned between legs -->
    <ellipse cx="0" cy="40" rx="12" ry="30" fill="pink" stroke="black" stroke-width="1"/>
    <ellipse cx="0" cy="50" rx="8" ry="20" fill="pink" stroke="black" stroke-width="1"/>
    
    <!-- Bart's Nipples (Small) -->
    <circle cx="-20" cy="-30" r="3" fill="pink" stroke="black" stroke-width="0.5"/>
    <circle cx="20" cy="-30" r="3" fill="pink" stroke="black" stroke-width="0.5"/>
  </g>
  
  <!-- Lisa Simpson - Right Side -->
  <g transform="translate(550,100)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="60" ry="80" fill="yellow" stroke="black" stroke-width="2"/>
    
    <!-- Head -->
    <circle cx="0" cy="-90" r="45" fill="yellow" stroke="black" stroke-width="2"/>
    
    <!-- Hair -->
    <path d="M-40,-90 Q-15,-130 0,-120 Q15,-130 40,-90 Q35,-80 20,-75 Q5,-80 -10,-75 Q-25,-80 -30,-85 Z" fill="black"/>
    
    <!-- Eyes -->
    <circle cx="-15" cy="-95" r="8" fill="white" stroke="black" stroke-width="1"/>
    <circle cx="15" cy="-95" r="8" fill="white" stroke="black" stroke-width="1"/>
    <circle cx="-15" cy="-95" r="4" fill="black"/>
    <circle cx="15" cy="-95" r="4" fill="black"/>
    
    <!-- Mouth -->
    <path d="M-10,-70 Q0,-60 10,-70" stroke="black" stroke-width="2" fill="none"/>
    
    <!-- Arms -->
    <ellipse cx="-70" cy="-20" rx="15" ry="40" fill="yellow" stroke="black" stroke-width="2" transform="rotate(-30)"/>
    <ellipse cx="70" cy="-20" rx="15" ry="40" fill="yellow" stroke="black" stroke-width="2" transform="rotate(30)"/>
    
    <!-- Legs -->
    <ellipse cx="-25" cy="80" rx="15" ry="40" fill="yellow" stroke="black" stroke-width="2"/>
    <ellipse cx="25" cy="80" rx="15" ry="40" fill="yellow" stroke="black" stroke-width="2"/>
    
    <!-- Belly Button -->
    <circle cx="0" cy="0" r="5" fill="black"/>
    
    <!-- Lisa's Pink Nipples -->
    <circle cx="-20" cy="-30" r="5" fill="pink" stroke="black" stroke-width="0.5"/>
    <circle cx="20" cy="-30" r="5" fill="pink" stroke="black" stroke-width="0.5"/>
    
    <!-- Lisa's Vaginal Slant - Proper small slant with pink labia -->
    <path d="M-15,40 Q0,50 15,40" stroke="black" stroke-width="2" fill="none"/>
    <path d="M-10,42 Q0,48 10,42" stroke="pink" stroke-width="1" fill="none"/>
    <!-- Labia for Lisa -->
    <ellipse cx="-10" cy="45" rx="6" ry="10" fill="pink" stroke="black" stroke-width="0.5"/>
    <ellipse cx="10" cy="45" rx="6" ry="10" fill="pink" stroke="black" stroke-width="0.5"/>
  </g>
</svg>
